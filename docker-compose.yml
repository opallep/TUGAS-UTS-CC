name: link-hub

services:
  backend:
    build: ./backend
    image: link-hub-backend:latest
    container_name: link-hub-backend
    restart: unless-stopped
    volumes:
      # Named Volume -> data links.json tetap aman walau kontainer dihapus
      - link-hub-data:/var/lib/backend_data
    networks:
      - app-net
    # Tidak di-expose ke host: hanya bisa diakses frontend lewat network app-net

  frontend:
    image: nginx:alpine
    container_name: link-hub-frontend
    restart: unless-stopped
    ports:
      - "8081:80"   # 8080 biasanya sudah dipakai Jenkins
    volumes:
      # Bind Mount -> edit index.html di host langsung terlihat tanpa rebuild.
      # HOST_PROJECT_DIR diisi otomatis oleh Jenkins (karena Jenkins jalan di dalam
      # kontainer, path workspace-nya harus diterjemahkan ke path yang dikenal Docker host).
      # Kalau dijalankan manual di laptop, otomatis memakai folder saat ini (.).
      - ${HOST_PROJECT_DIR:-.}/frontend:/usr/share/nginx/html:ro
      - ${HOST_PROJECT_DIR:-.}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  link-hub-data:
    name: link-hub-data
